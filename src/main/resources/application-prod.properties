# ----- Spring 框架配置 -----
logging.level.root=INFO

# ----- 数据库配置 -----
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# ----- 数据库账户配置 -----
# 请在插件数据目录的同名文件中填写生产 MySQL 连接信息，避免将凭据提交或打入插件包。
# 也可通过同名环境变量向服务器进程注入这些值。
spring.datasource.url=${TEANEKO_DATABASE_URL:}
spring.datasource.username=${TEANEKO_DATABASE_USERNAME:}
spring.datasource.password=${TEANEKO_DATABASE_PASSWORD:}
